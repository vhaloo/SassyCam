name: Build SassyCam Windows

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Custom Script)
      run: |
        python build_v2.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SassyCam-Windows-Build
        path: dist/SassyCam/
